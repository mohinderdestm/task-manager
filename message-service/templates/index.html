<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat app</title>

<style>
body {
    font-family: Arial;
    display: flex;
    height: 100vh;
    margin: 0;
}

.sidebar {
    width: 320px;
    background: #2c3e50;
    color: white;
    padding: 15px;
    overflow-y: auto;
}

.sidebar input {
    padding: 8px;
    margin: 5px 0;
    border-radius: 20px;
}

.sidebar button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #27ae60;
    border: none;
    color: white;
    cursor: pointer;
}

.scroll-box {
    /* max-height: 200px;   */
    overflow-y: auto;
    padding-right: 5px;
}

.user-item {
    background: white;
    color: black;
    padding: 8px;
    margin-bottom: 5px;
    border-radius: 5px;
    display: flex;
    align-items: center;
}

.user-item input {
    margin-right: 10px;
}

.user-item:hover {
    background: #dfe6e9;
}

.chat-list {
    flex: 1;
    background: #ecf0f1;
    padding: 10px;
    overflow-y: auto;
}

.chat-item {
    background: white;
    padding: 10px;
    margin-bottom: 5px;
    cursor: pointer;
    border-radius: 20px;
}

.chat-item b{
    color: black;
}

.chat-item:hover {
    background: #dfe6e9;
}

.section {
    margin-bottom: 20px;
}
</style>
</head>

<body>

<div class="sidebar">

    <div style="margin-bottom: 15px;">
        <h3 id="welcomeUser">Welcome</h3>
    </div>

    <div class="section">
        <h3>Users</h3>
        <input id="search" placeholder="Search..." onkeyup="filterUsers()">
        <div id="users" class="scroll-box"></div>
    </div>
    <div class="section">
        <h3>Create Group</h3>

        <input id="group_name" placeholder="Group Name">

        <div id="groupUsers" class="scroll-box"></div>

        <button onclick="createGroup()">Create Group</button>
    </div>

</div>

<div class="chat-list">
    <h3>My Chats</h3>
    <div id="chats" class="scroll-box"></div>
</div>

<script>
let allUsers = [];

function getUserName() {
    const token = sessionStorage.getItem("token");
    const payload = JSON.parse(atob(token.split('.')[1]));
    return payload.name || payload.email;
}


async function loadUsers() {
    const res = await fetch("/users", {
        headers: {
            "Authorization": "Bearer " + sessionStorage.getItem("token")
        }
    });

    const data = await res.json();
    allUsers = data;

    renderUsers(data);
    renderGroupUsers(data);
}

function renderUsers(users) {
    const box = document.getElementById("users");
    box.innerHTML = "";

    users.forEach(u => {
        box.innerHTML += `
            <div class="chat-item" onclick="startChat('${u.email}')">
                <b>${u.name}</b><br>
            </div>
        `;
    });
}

function renderGroupUsers(users) {
    const box = document.getElementById("groupUsers");
    box.innerHTML = "";

    users.forEach(u => {
        box.innerHTML += `
            <div class="user-item">
                <input type="checkbox" value="${u.email}">
                <div>
                    <b>${u.name}</b><br>
                </div>
            </div>
        `;
    });
}

function filterUsers() {
    const q = document.getElementById("search").value.toLowerCase();

    const filtered = allUsers.filter(u =>
        u.name.toLowerCase().includes(q) ||
        u.email.toLowerCase().includes(q)
    );

    renderUsers(filtered);
    renderGroupUsers(filtered);
}

async function startChat(email) {
    const res = await fetch("/create-chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + sessionStorage.getItem("token")
        },
        body: JSON.stringify({ other_user: email })
    });

    const data = await res.json();

    if (data.conversation_id) {
        window.location.href = `/chat/${data.conversation_id}`;
    }
}

async function createGroup() {

    const checkboxes = document.querySelectorAll("#groupUsers input:checked");

    const members = Array.from(checkboxes).map(cb => cb.value);

    if (members.length === 0) {
        alert("Select at least one user");
        return;
    }

    const res = await fetch("/create-group", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + sessionStorage.getItem("token")
        },
        body: JSON.stringify({
            group_name: document.getElementById("group_name").value,
            members: members
        })
    });

    const data = await res.json();

    if (data.conversation_id) {
        window.location.href = `/chat/${data.conversation_id}`;
    } else {
        alert("Error creating group");
    }
}

function getNameFromEmail(email) {
    const user = allUsers.find(u => u.email === email);
    return user ? user.name : email;
}


async function loadChats() {
    const res = await fetch("/my-chats", {
        headers: {
            "Authorization": "Bearer " + sessionStorage.getItem("token")
        }
    });

    const data = await res.json();

    const box = document.getElementById("chats");
    box.innerHTML = "";

    const myEmail = getUserEmail();

    data.forEach(chat => {

        let name;

        if (chat.is_group) {
            name = chat.group_name || "Group";
        } else {
            const otherEmail = chat.participants.find(p => p !== myEmail);
            name = getNameFromEmail(otherEmail);
        }

        box.innerHTML += `
            <div class="chat-item" style="display:flex; justify-content:space-between; align-items:center;">
                
                <div onclick="openChat('${chat.conversation_id}')" style="flex:1;">
                   <b>${name}</b><br>
                     <small style="color:gray;">${chat.last_message || ""}</small>
                </div>

                <button onclick="deleteForMe('${chat.conversation_id}')"
                        style="background:red; color:white; border:none; padding:5px 8px; cursor:pointer;">
                    X
                </button>

            </div>
        `;
    });
}

async function deleteForMe(id) {
    if (!confirm("Delete this chat for you?")) return;

    const res = await fetch(`/delete-for-me/${id}`, {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + sessionStorage.getItem("token")
        }
    });

    const data = await res.json();

    alert(data.message || data.error);

    loadChats();
}

function openChat(id) {
    window.location.href = `/chat/${id}`;
}

function getUserEmail() {
    const token = sessionStorage.getItem("token");
    const payload = JSON.parse(atob(token.split('.')[1]));
    return payload.email;
}

async function init() {
    const name = getUserName();
    document.getElementById("welcomeUser").innerText = "Welcome, " + name;

    await loadUsers();
    loadChats();
    setInterval(loadChats, 2000);

}

init();
</script>

</body>
</html>
