<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.header {
    background: #2c3e50;
    color: white;
    padding: 10px;
}

#box {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    background: #ecf0f1;
}

.msg {
    margin: 5px 0;
    padding: 8px;
    border-radius: 8px;
    max-width: 20%;
}

.me {
    background: #3498db;
    color: white;
    margin-left: auto;
}

.other {
    background: white;
}

.footer {
    display: flex;
}

.footer input {
    flex: 1;
    padding: 10px;
}

.footer button {
    padding: 10px;
    background: #2ecc71;
    color: white;
    border: none;
}
</style>
</head>

<body>

<div class="header" id="chatHeader">Chat</div>

<div id="box"></div>

<div id="typing" style="padding:5px; color:gray;"></div>

<div class="footer">
    <input id="msg" placeholder="Type message..." oninput="sendTyping()">
    <button onclick="send()">Send</button>
</div>

<script>
const convo = "{{conversation_id}}";
const token = sessionStorage.getItem("token");

const ws = new WebSocket(`ws://127.0.0.1:8000/ws/${convo}?token=${token}`);
const box = document.getElementById("box");

function getUserData() {
    const payload = JSON.parse(atob(token.split('.')[1]));
    return {
        name: payload.name,
        email: payload.email
    };
}

const currentUser = getUserData();

function getNameFromEmail(email) {
    if (email === currentUser.email) {
        return currentUser.name;
    }
    return email.split("@")[0];
}

async function load() {
    const res = await fetch(`/messages/${convo}`, {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const data = await res.json();

    data.forEach(m => addMsg(m.sender, m.text));
}

function addMsg(sender, text) {
    const div = document.createElement("div");
    div.classList.add("msg");

    if (sender === currentUser.email) {
        div.classList.add("me");
    } else {
        div.classList.add("other");
    }

    const name = getNameFromEmail(sender);

    div.innerHTML = `<b>${name}</b><br>${text}`;

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

let typingTimeout;

function showTyping(sender) {
    const div = document.getElementById("typing");
    div.innerText = getNameFromEmail(sender) + " is typing...";

    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
        div.innerText = "";
    }, 2000);
}

function clearTyping() {
    document.getElementById("typing").innerText = "";
}

function sendTyping() {
    ws.send(JSON.stringify({ type: "typing" }));
}

ws.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.type === "typing") {
        showTyping(data.sender);
    }

    if (data.type === "message") {
        addMsg(data.sender, data.text);
        clearTyping();
    }
};

function send() {
    if (!msg.value) return;

    ws.send(JSON.stringify({
        type: "message",
        text: msg.value
    }));

    msg.value = "";
}

load();
</script>

</body>
</html>
