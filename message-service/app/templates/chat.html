<!doctype html>

<html>
  <head>
    <title>Chat App</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100vh;
        background: linear-gradient(135deg, #5455b0 0%, #764ba2 100%);
        display: flex;
        overflow: hidden;
      }

      .container {
        display: flex;
        width: 100%;
        height: 100vh;
      }

      /* SIDEBAR */
      .sidebar {
        width: 320px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-right: 1px solid #e5e7eb;
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 20px;
        background: linear-gradient(135deg, #5455b0, #8b5cf6);
        color: white;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
      }

      .connect-section {
        padding: 15px;
        border-bottom: 1px solid #eee;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 15px;
      }

      .input-group input,
      .input-group select,
      #groupId,
      #userSearch {
        width: 100%;
        padding: 14px 14px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 14px;
      }

      .btn {
        width: 100%;
        padding: 12px 20px;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 10px;
      }

      .connect-section {
        padding: 20px;
        background: white;
        border-bottom: 1px solid #eee;
        display: flex;
        flex-direction: column;
        gap: 10px; /* ✅ spacing between input + buttons */
      }

      .connect-section input {
        padding: 8px 10px;
        border-radius: 12px;
      }

      .btn-primary {
        background: #5455b0;
        color: white;
      }

      .btn-secondary {
        background: #e5e7eb;
      }

      .group-section {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
      }

      /* CHAT LIST */
      #chatList div {
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 6px;
        cursor: pointer;
        transition: 0.2s;
      }

      #chatList div:hover {
        background: #eef2ff;
      }

      #chatList .active {
        background: #4f46e5;
        color: white;
      }

      /* MAIN CHAT */
      .main-chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: white;
      }

      .chat-header {
        padding: 15px 20px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .chat-header input,
      .chat-header select {
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      /* MESSAGES */
      .messages-container {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #f8fafc;
      }

      .messages {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .messages li {
        padding: 12px 16px;
        border-radius: 18px;
        max-width: 65%;
        font-size: 14px;
        line-height: 1.4;
      }

      /* YOUR MESSAGE */
      .green {
        background: #dcfce7;
        color: #166534;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
      }

      /* OTHER MESSAGE */
      .blue {
        background: white;
        border: 1px solid #e5e7eb;
        color: #111827;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }

      /* INPUT */
      .chat-input {
        padding: 15px;
        border-top: 1px solid #eee;
        display: flex;
        gap: 10px;
      }

      .chat-input input {
        flex: 1;
        padding: 12px;
        border-radius: 20px;
        border: 1px solid #ddd;
      }

      .chat-input button {
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 10px 18px;
        cursor: pointer;
      }

      #directChats div,
      #groupChats div {
        padding: 6px 8px;
        margin-bottom: 5px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
      }
      #searchResults {
        display: none; /* hidden initially */
        max-height: 150px;
        overflow-y: auto;
        border: 1px solid #eee;
        border-radius: 10px;
        background: white;
      }

      #receiverResults {
        display: none;
        position: absolute;
        top: 38px;
        width: 100%;
        max-height: 150px;
        overflow-y: auto;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        z-index: 100;
      }

      #receiverResults div {
        padding: 8px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
      }

      #receiverResults div:hover {
        background: #eef2ff;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="header">Chat App</div>
        <div class="connect-section">
          <input id="userId" placeholder="Enter user id" />
          <button class="btn btn-primary" onclick="connect()">Connect</button>
          <button class="btn btn-secondary" onclick="setToken()">
            Set Token
          </button>
        </div>

        <div class="group-section">
          <h3 style="margin-top: 15px;margin-bottom:12px">Direct Chats</h3>
          <div id="directChats"></div>

          <h3 style="margin-top: 15px; margin-bottom: 15px">Groups</h3>
          <div id="groupChats"></div>
          <input id="groupId" placeholder="Group Name" />
          <input
            id="userSearch"
            placeholder="Search users"
            oninput="filterUsers()"
          />
          <div id="searchResults"></div>
          <div id="selectedUsers"></div>
          <button class="btn btn-primary" onclick="createGroup()">
            Create Group
          </button>       
        </div>
      </div>

      <!-- MAIN CHAT -->
      <div class="main-chat">
        <div class="chat-header">
          <select id="chatType">
            <option value="direct">Direct</option>
            <option value="group">Group</option>
          </select>
          <!-- <input id="receiver" placeholder="Receiver" /> -->
          <div style="position: relative; width: 200px">
            <input
              id="receiver"
              placeholder="Search user/group"
              oninput="searchReceiver()"
            />
            <div id="receiverResults"></div>
          </div>
        </div>

        <div class="messages-container">
          <ul id="messages" class="messages"></ul>
        </div>

        <div class="chat-input">
          <input id="message" placeholder="Type a message..." />
          <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>
      </div>
    </div>

    <script>
      let ws;
      let allUsers = [];
      let selectedMembers = [];

      function connect() {
        const userId = document.getElementById("userId").value.toLowerCase();

        ws = new WebSocket(`ws://localhost:8005/ws/${userId}`);

        ws.onopen = () => {
          document.getElementById("sendBtn").disabled = false;
          loadChats();
        };

        ws.onmessage = (event) => {
          const li = document.createElement("li");

          if (event.data.includes("You:")) {
            li.className = "green";
          } else {
            li.className = "blue";
          }

          li.innerText = event.data;
          document.getElementById("messages").appendChild(li);
        };
      }

      function setToken() {
        const token = prompt("Paste your token here:");
        if (!token) return;

        localStorage.setItem("token", token);
        alert("Token saved! Now refresh page.");

        console.log("Saved token:", token);
      }

      function sendMessage() {
        const type = document.getElementById("chatType").value;
        const receiver = document
          .getElementById("receiver")
          .value.toLowerCase();
        const message = document.getElementById("message").value;

        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        if (type === "group") {
          ws.send(`group:${receiver}:${message}`);
        } else {
          ws.send(`${receiver}:${message}`);
        }

        document.getElementById("message").value = "";
        setTimeout(loadChats, 300);
      }

      async function loadChats() {
        const userId = document.getElementById("userId").value.toLowerCase();

        const res = await fetch(
          `http://localhost:8005/conversations/${userId}`,
        );
        const data = await res.json();

        currentGroups = data.groups;

        const directBox = document.getElementById("directChats");
        const groupBox = document.getElementById("groupChats");

        directBox.innerHTML = "";
        groupBox.innerHTML = "";

        // 👤 DIRECT CHATS
        data.direct.forEach((user) => {
          const div = document.createElement("div");
          div.innerText = "👤 " + user;

          div.onclick = () => openChat("direct", user, div);

          directBox.appendChild(div);
        });

        // 👥 GROUP CHATS
        data.groups.forEach((group) => {
          const div = document.createElement("div");
          div.innerText = "👥 " + group;

          div.onclick = () => openChat("group", group, div);

          groupBox.appendChild(div);
        });
      }

      //load users
      async function loadUsers() {
        const token = localStorage.getItem("token");

        const res = await fetch("http://localhost:8001/users/public", {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        const data = await res.json();
        allUsers = data.users || data;
      }

      // search function

      function filterUsers() {
        const query = document.getElementById("userSearch").value.toLowerCase();
        const resultsDiv = document.getElementById("searchResults");

        resultsDiv.innerHTML = "";

        // if (!query) return;
        if (!query) {
          resultsDiv.style.display = "none"; 
          return;
        }

        const filtered = allUsers.filter((user) =>
          (user.name || "").toLowerCase().startsWith(query),
        );

        if (filtered.length === 0) {
          resultsDiv.innerHTML = `<div style="padding:8px;color:gray;">No users found</div>`;
          resultsDiv.style.display = "block";
          return;
        }

        filtered.forEach((user) => {
          const username = user.name?.toLowerCase();

          const div = document.createElement("div");
          div.innerText = username;
          div.style.padding = "8px";
          div.style.cursor = "pointer";
          div.style.borderBottom = "1px solid #eee";

          div.addEventListener("click", () => {
            addUser(username);

            // clear search UI
            document.getElementById("userSearch").value = "";
            resultsDiv.innerHTML = "";
            resultsDiv.style.display = "none"; 
          });

          resultsDiv.appendChild(div);
        });
        resultsDiv.style.display = "block";
      }

      // chip function

      function addUser(name) {
        if (!name) return;

        if (selectedMembers.includes(name)) {
          alert("User already added");
          return;
        }

        selectedMembers.push(name);
        console.log("Selected Members:", selectedMembers); 

        const container = document.getElementById("selectedUsers");

        const chip = document.createElement("div");
        chip.innerText = name + " ✕";
        chip.style.background = "#e0e7ff";
        chip.style.padding = "6px 10px";
        chip.style.borderRadius = "12px";
        chip.style.cursor = "pointer";

        chip.onclick = () => {
          selectedMembers = selectedMembers.filter((u) => u !== name);
          chip.remove();
        };

        container.appendChild(chip);
      }

      //creating group

      async function createGroup() {
        const groupName = document.getElementById("groupId").value;
        const token = localStorage.getItem("token");

        if (!groupName) {
          alert("Enter group name");
          return;
        }

        if (selectedMembers.length === 0) {
          alert("Add at least 1 member");
          return;
        }

        try {
          const res = await fetch("http://localhost:8005/create-group", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              group_id: groupName,
              members: selectedMembers,
            }),
          });

          const data = await res.json();

          console.log("Group response:", data);

          if (!res.ok) {
            alert(data.detail || "Group creation failed");
            return;
          }

          alert("✅ Group created!");

         
          selectedMembers = [];
          document.getElementById("selectedUsers").innerHTML = "";
          document.getElementById("groupId").value = "";

          loadChats();
        } catch (err) {
          console.error(err);
          alert("Error creating group");
        }
      }

      //receiver search
      function searchReceiver() {
        const query = document.getElementById("receiver").value.toLowerCase();
        const resultsDiv = document.getElementById("receiverResults");

        resultsDiv.innerHTML = "";

        if (!query) {
          resultsDiv.style.display = "none";
          return;
        }

        // combine users + groups
        const allOptions = [
          ...allUsers.map((u) => ({ type: "direct", name: u.name })),
          ...currentGroups.map((g) => ({ type: "group", name: g })),
        ];

        const filtered = allOptions.filter((item) =>
          item.name.toLowerCase().includes(query),
        );

        if (filtered.length === 0) {
          resultsDiv.innerHTML = `<div style="color:gray;">No results</div>`;
          resultsDiv.style.display = "block";
          return;
        }

        filtered.forEach((item) => {
          const div = document.createElement("div");
          div.innerText =
            item.type === "group" ? "👥 " + item.name : "👤 " + item.name;

          div.onclick = () => {
            document.getElementById("receiver").value = item.name;
            document.getElementById("chatType").value = item.type;

            resultsDiv.style.display = "none";
          };

          resultsDiv.appendChild(div);
        });

        resultsDiv.style.display = "block";
      }

      async function openChat(type, chatId, element) {
        document.getElementById("chatType").value = type;
        document.getElementById("receiver").value = chatId;

        document
          .querySelectorAll("#chatList div")
          .forEach((d) => d.classList.remove("active"));
        element.classList.add("active");

        const userId = document.getElementById("userId").value.toLowerCase();

        const res = await fetch(
          `http://localhost:8005/messages/${type}/${chatId}/${userId}`,
        );

        const messages = await res.json();

        const msgBox = document.getElementById("messages");
        msgBox.innerHTML = "";

        messages.forEach((msg) => {
          const li = document.createElement("li");

          if (msg.sender === userId) {
            li.className = "green";
            li.innerText = "You: " + msg.message;
          } else {
            li.className = "blue";
            li.innerText = msg.sender + ": " + msg.message;
          }

          msgBox.appendChild(li);
        });

        msgBox.scrollTop = msgBox.scrollHeight;
      }

      window.onload = loadUsers;
    </script>
  </body>
</html>
